name: Build Android APK

'on':
push:
branches:
- main
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-24.04

steps:
  - name: Checkout repository
    uses: actions/checkout@v5

  - name: Show repository files
    run: |
      pwd
      ls -la
      find . -maxdepth 4 -type f \( -name "gradlew" -o -name "settings.gradle.kts" -o -name "libs.versions.toml" \)
