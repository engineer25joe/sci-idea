name: Validate Android Build Workflow

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: List repository files
        shell: bash
        run: |
          echo "Repository root:"
          pwd
          ls -la
          echo "Searching for Android build files:"
          find . -maxdepth 5 -type f -name "gradlew" -not -path "./.git/*"
